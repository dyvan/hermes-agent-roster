name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check (frontend IIFE)
        run: node --check dashboard/dist/index.js
      - name: Syntax check (backend + bridge example)
        run: python3 -m py_compile dashboard/plugin_api.py examples/pipeline-bridge/pipeline_bridge.py
      - name: Unit tests (hermetic)
        run: python3 -m unittest discover -s tests -v
